version: '3.8'

services:
  reverse-proxy:
    image: caddy:2-alpine
    container_name: jbcunha-proxy
    restart: unless-stopped
    depends_on:
      - gestao-patio
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - jbcunha-net

  glpi-db:
    image: mariadb:10.11
    container_name: jbcunha-glpi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-jbcunha_root_db_secret}
      MYSQL_DATABASE: ${DB_NAME:-glpidb}
      MYSQL_USER: ${DB_USER:-glpi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-jbcunha_glpi_secret_pass}
    volumes:
      - glpi-db-data:/var/lib/mysql
      - ./database/init-glpi.sql:/docker-entrypoint-initdb.d/init-glpi.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - jbcunha-net

  gestao-patio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jbcunha-gestao-patio
    restart: unless-stopped
    depends_on:
      glpi-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=glpi-db
      - DB_PORT=3306
      - DB_NAME=glpidb
      - DB_USER=glpi
      - DB_PASSWORD=jbcunha_glpi_secret_pass
      - GLPI_ENABLED=true
    volumes:
      - ./api-gateway/data:/app/api-gateway/data
      - ./web-app/uploads:/app/web-app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/jbc/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - jbcunha-net

volumes:
  glpi-db-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  jbcunha-net:
    driver: bridge
